name: Release

# Publishing is a deliberate human decision: it only runs via manual dispatch,
# and only once the repo owner has added an NPM_TOKEN secret (and owns the
# @through-line scope on npm). Version bumps are plain commits that set the
# same version in every packages/*/package.json.
on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm (manual)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Guard - require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm automation token for the @through-line scope and add it as a repository secret before publishing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # All @through-line/* packages version in lockstep, so one unified vX.Y.Z tag and
      # GitHub release represent the whole publish. Idempotent so a re-dispatch doesn't fail.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
