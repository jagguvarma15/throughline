name: Release

on:
  push:
    branches: [main]
  # Publishing is a deliberate human decision: it only runs via manual dispatch,
  # and only once the repo owner has added an NPM_TOKEN secret (and owns the
  # @throughline scope on npm).
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  version:
    name: Commit version bumps to main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applies pending .changeset/*.md entries (version bumps + CHANGELOGs) and pushes
      # the result straight to main — no PR, so this works without the "Actions may
      # create pull requests" repo setting. GITHUB_TOKEN pushes don't re-trigger
      # workflows, so this cannot loop. Versioning is still not a publish.
      - name: Version packages and push
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -v README.md >/dev/null; then
            echo "No pending changesets."
            exit 0
          fi
          pnpm version-packages
          pnpm install --lockfile-only
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version packages"
          git push origin main

  publish:
    name: Publish to npm (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Guard - require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm automation token for the @throughline scope and add it as a repository secret before publishing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
