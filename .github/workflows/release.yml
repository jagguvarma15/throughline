name: Release

on:
  push:
    branches: [main]
  # Publishing is a deliberate human decision: it only runs via manual dispatch,
  # and only once the repo owner has added an NPM_TOKEN secret (and owns the
  # @throughline scope on npm).
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  version-pr:
    name: Open or update the Version Packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Collects pending .changeset/*.md entries into a "Version Packages" PR
      # (version bumps + CHANGELOGs). Merging that PR is still not a publish.
      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: "Version Packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Guard - require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm automation token for the @throughline scope and add it as a repository secret before publishing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
