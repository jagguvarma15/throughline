name: CI

on:
  push:
    branches: [main, redesign]
  # No branch filter: stacked PRs (base = another feature branch) also get CI.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: throughline
          POSTGRES_PASSWORD: throughline
          POSTGRES_DB: throughline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Forbidden deps check
        run: node scripts/check-forbidden-deps.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r --if-present test
        env:
          THROUGHLINE_TEST_PG: postgres://throughline:throughline@localhost:5432/throughline

      - name: Build
        run: pnpm -r build

      - name: API docs (typedoc, non-blocking)
        run: pnpm docs:api
        continue-on-error: true

  security:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        # Don't fail CI if code scanning is unavailable (e.g. GHAS off on a private repo).
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
