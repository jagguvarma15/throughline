# Complete reference stack: application + monitoring.
# Run with: docker compose -f docker-compose.full.yml up

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  control-plane:
    extends:
      file: docker-compose.yml
      service: control-plane

  dashboard:
    extends:
      file: docker-compose.yml
      service: dashboard

  prometheus:
    extends:
      file: docker-compose.monitoring.yml
      service: prometheus

  grafana:
    extends:
      file: docker-compose.monitoring.yml
      service: grafana

  cadvisor:
    extends:
      file: docker-compose.monitoring.yml
      service: cadvisor

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  throughline_network:
    driver: bridge
  monitoring_network:
    driver: bridge
