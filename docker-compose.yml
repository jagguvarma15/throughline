services:
  # Postgres — the production durability store.
  postgres:
    image: postgres:16-alpine
    container_name: throughline_postgres
    environment:
      POSTGRES_DB: throughline
      POSTGRES_USER: throughline
      POSTGRES_PASSWORD: throughline
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U throughline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - throughline_network

  # Control-plane — thin read/op API over the store (durability lives in the worker).
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    image: throughline-control-plane
    container_name: throughline_control_plane
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://throughline:throughline@postgres:5432/throughline
      # Local reference stack only. For anything reachable, set THROUGHLINE_API_TOKEN
      # (and VITE_CP_TOKEN in the dashboard build) instead of allowing anonymous access.
      THROUGHLINE_ALLOW_ANON: "1"
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - throughline_network

  # Dashboard — durable-run UI (static build served by nginx).
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: throughline-dashboard
    container_name: throughline_dashboard
    ports:
      - "3000:80"
    depends_on:
      - control-plane
    networks:
      - throughline_network

volumes:
  postgres_data:

networks:
  throughline_network:
    driver: bridge
